name: Semgrep

# Static analysis (SAST) with Semgrep Community Edition (#2272). Tokenless:
# uses the public registry rulesets, needs zero secrets. Findings print in
# the job log; no code-scanning/SARIF upload by design (keeps permissions
# read-only, no security-events: write).

on:
  pull_request:
    branches: [master]
  schedule:
    - cron: '30 7 * * 1'  # weekly, Monday 07:30 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep:1.170.0@sha256:c98f8829eea377274ee4b10656458b078b88232469b2ff913f091c2317347c9d
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # Full history so --baseline-commit can diff against the PR base;
          # a shallow clone would not contain the base commit.
          fetch-depth: 0
      # Normal PRs fail on findings NEW since their merge base. Trusted,
      # fork-owned upstream sync branches still run the exact same scan but
      # report findings without failing the sync on upstream-owned history.
      # Scheduled/dispatch runs have no PR base and remain full-tree report-only.
      - name: Semgrep scan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            # Diff against the MERGE BASE, not the base-branch head captured at
            # event time: the checkout is the merge ref against current master,
            # so a finding master landed after the event would otherwise be
            # attributed to this PR. merge-base is the true common ancestor.
            BASELINE="$(git merge-base "$BASE_SHA" HEAD || echo "$BASE_SHA")"

            if [ "$HEAD_REPO" = "$THIS_REPO" ]; then
              case "$HEAD_REF" in
                sync/upstream-*)
                  echo "Trusted fork-owned upstream sync — reporting findings new since $BASELINE without failing on upstream-owned findings"
                  semgrep scan --config p/default --config p/typescript --baseline-commit "$BASELINE"
                  exit $?
                  ;;
              esac
            fi

            echo "PR scan — failing only on findings new since $BASELINE"
            semgrep scan --config p/default --config p/typescript --error --baseline-commit "$BASELINE"
          else
            echo "Full-tree scan (schedule/dispatch) — report-only"
            semgrep scan --config p/default --config p/typescript || true
          fi
